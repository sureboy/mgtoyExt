<html lang="zh-cn">
<head>
<meta charset="utf-8" />
<style> 
/* 摇杆 Canvas 层：半透明控件叠加 */
#joystickCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;   /* 防止触摸时滚动/缩放 */
    z-index: 2;
}

#joystickCanvas:active {
    cursor: grabbing;
}
</style>
</head>
<body>
<canvas id="joystickCanvas" ></canvas>
<script src="./mytest/test.js" type="module" > </script>
 
</body>
</html>
